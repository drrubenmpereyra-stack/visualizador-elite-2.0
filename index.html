<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador Consolidado - Elite 2.0</title>
    <!-- SDK de Firebase (Compat version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 20px;
        }
        .elite-viewer-container {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            height: 90vh;
        }
        .elite-panel-sidebar {
            width: 38%;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .elite-panel-sidebar h3 {
            font-size: 1.2rem;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .elite-subtitle {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 12px;
        }
        .elite-list {
            overflow-y: auto;
            flex-grow: 1;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
            padding: 10px;
            margin-bottom: 15px;
        }
        .elite-item-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .elite-item-row:hover {
            border-color: #0284c7;
        }
        .elite-panel-preview {
            width: 62%;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 30px;
            overflow-y: auto;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        .preview-header {
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .preview-header h2 {
            font-size: 1.4rem;
            color: #0f172a;
        }
        #elite-preview-content {
            flex-grow: 1;
        }
        .elite-actions {
            display: flex;
            gap: 12px;
        }
        .elite-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .elite-btn.primary { background: #0284c7; color: white; }
        .elite-btn.secondary { background: #e2e8f0; color: #334155; }
        .elite-btn:hover { opacity: 0.9; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
            background: #e0f2fe;
            color: #0369a1;
            margin-bottom: 4px;
        }
        .selector-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: none;
        }
        .selector-box select {
            width: 100%;
            padding: 8px;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            font-size: 0.9rem;
            background: #fff;
        }

        @media print {
            body { background: #fff; padding: 0; }
            .elite-panel-sidebar { display: none; }
            .elite-panel-preview {
                width: 100%;
                border: none;
                box-shadow: none;
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <div class="elite-viewer-container">
        <!-- Panel Izquierdo: Selección -->
        <div class="elite-panel-sidebar">
            <h3>Visor Elite 2.0</h3>
            <p class="elite-subtitle" id="patient-info-label">Cargando sistema...</p>
            
            <!-- Selector automático de pacientes si no viene por URL -->
            <div id="selector-container" class="selector-box">
                <p style="font-size: 0.85rem; margin-bottom: 6px; font-weight: 600; color: #334155;">Seleccionar paciente:</p>
                <select id="patient-select" onchange="seleccionarPacienteDirecto(this.value)">
                    <option value="">-- Cargando lista de pacientes... --</option>
                </select>
            </div>
            
            <div id="elite-items-list" class="elite-list">
                <p style="text-align: center; color: #64748b; margin-top: 20px;">Seleccione un paciente para ver sus registros.</p>
            </div>
            
            <div class="elite-actions">
                <button id="btn-save-report" class="elite-btn primary">Guardar en H.C.</button>
                <button id="btn-print-report" class="elite-btn secondary">Imprimir</button>
            </div>
        </div>

        <!-- Panel Derecho: Previsualización -->
        <div class="elite-panel-preview" id="elite-preview-area">
            <div class="preview-header">
                <h2>Reporte Clínico Consolidado</h2>
                <p style="color: #64748b; font-size: 0.9rem;">Seleccione los registros del panel izquierdo para generar la vista previa.</p>
            </div>
            <div id="elite-preview-content">
                <p style="color: #94a3b8; font-style: italic;">Sin elementos seleccionados.</p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCJietA0GuHsUpkN2-lk38Y3L6VDROxvZs",
            authDomain: "materiales-terapeuticos.firebaseapp.com",
            projectId: "materiales-terapeuticos",
            storageBucket: "materiales-terapeuticos.firebasestorage.app",
            messagingSenderId: "827133493876",
            appId: "1:827133493876:web:7d51b4befe64e0f8dfc721"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        let patientId = urlParams.get('patientId');
        let cacheDatosPaciente = [];

        window.onload = async () => {
            if (!patientId) {
                // Si no hay ID en la URL, cargamos el listado completo de pacientes desde Firestore
                document.getElementById('selector-container').style.display = 'block';
                document.getElementById('patient-info-label').innerText = "Modo interactivo (Elige un paciente)";
                await cargarListaPacientes();
            } else {
                // Si viene el ID en la URL (ideal para cuando se conecte desde Elite 2.0)
                document.getElementById('patient-info-label').innerText = `ID Activo: ${patientId}`;
                await inicializarVisualizador(patientId);
            }
        };

        async function cargarListaPacientes() {
            const select = document.getElementById('patient-select');
            try {
                const snapshot = await db.collection('patients').get();
                if (snapshot.empty) {
                    select.innerHTML = '<option value="">No hay pacientes registrados en Firestore</option>';
                    return;
                }

                select.innerHTML = '<option value="">-- Seleccione un paciente --</option>';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // Intentamos mostrar nombre, apellido o DNI si existen, sino mostramos el ID
                    const nombreCompleto = data.nombre && data.apellido ? `${data.apellido}, ${data.nombre}` : (data.nombre || `Paciente (${doc.id})`);
                    select.innerHTML += `<option value="${doc.id}">${nombreCompleto} [ID: ${doc.id}]</option>`;
                });
            } catch (error) {
                console.error(error);
                select.innerHTML = '<option value="">Error al cargar pacientes</option>';
            }
        }

        function seleccionarPacienteDirecto(idSeleccionado) {
            if (!idSeleccionado) return;
            patientId = idSeleccionado;
            inicializarVisualizador(patientId);
        }

        async function inicializarVisualizador(idPaciente) {
            const containerList = document.getElementById('elite-items-list');
            containerList.innerHTML = "<p style='text-align: center; color: #64748b; margin-top: 20px;'>Cargando registros...</p>";

            try {
                const [labsSnap, signosSnap, informesSnap] = await Promise.all([
                    db.collection('patients').doc(idPaciente).collection('laboratorios').get(),
                    db.collection('patients').doc(idPaciente).collection('signos_vitales').get(),
                    db.collection('patients').doc(idPaciente).collection('informes_medicos').get()
                ]);

                cacheDatosPaciente = [];
                
                const procesarDocs = (snapshot, tipo) => {
                    snapshot.forEach(doc => {
                        cacheDatosPaciente.push({ id: doc.id, tipo, ...doc.data() });
                    });
                };

                procesarDocs(labsSnap, 'Laboratorio');
                procesarDocs(signosSnap, 'Signos Vitales');
                procesarDocs(informesSnap, 'Informe Médico');

                if (cacheDatosPaciente.length === 0) {
                    containerList.innerHTML = "<p style='text-align: center; color: #e11d48; margin-top: 20px;'>Este paciente no tiene registros guardados.</p>";
                    document.getElementById('elite-preview-content').innerHTML = "<p style='color: #94a3b8; font-style: italic;'>Sin elementos.</p>";
                    return;
                }

                cacheDatosPaciente.sort((a, b) => {
                    const fechaA = a.fecha?.toMillis ? a.fecha.toMillis() : 0;
                    const fechaB = b.fecha?.toMillis ? b.fecha.toMillis() : 0;
                    return fechaB - fechaA;
                });

                containerList.innerHTML = "";
                cacheDatosPaciente.forEach(item => {
                    let fechaStr = "Fecha no registrada";
                    if (item.fecha && item.fecha.toDate) {
                        fechaStr = item.fecha.toDate().toLocaleDateString();
                    }

                    containerList.innerHTML += `
                        <div class="elite-item-row">
                            <input type="checkbox" value="${item.id}" onchange="actualizarPrevisualizacion()" style="margin-top: 3px;">
                            <div>
                                <span class="badge">${item.tipo}</span>
                                <div style="font-weight: 600; font-size: 0.9rem;">${item.titulo || item.resumen || 'Registro sin título'}</div>
                                <small style="color: #64748b;">${fechaStr}</small>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                console.error(error);
                containerList.innerHTML = "<p style='text-align: center; color: #e11d48; margin-top: 20px;'>Error al consultar los registros.</p>";
            }
        }

        function actualizarPrevisualizacion() {
            const checkboxes = document.querySelectorAll('#elite-items-list input[type="checkbox"]:checked');
            const previewContent = document.getElementById('elite-preview-content');
            
            if (checkboxes.length === 0) {
                previewContent.innerHTML = "<p style='color: #94a3b8; font-style: italic;'>Sin elementos seleccionados.</p>";
                return;
            }

            previewContent.innerHTML = "";
            checkboxes.forEach(chk => {
                const itemData = cacheDatosPaciente.find(i => i.id === chk.value);
                if (itemData) {
                    let fechaStr = itemData.fecha?.toDate ? itemData.fecha.toDate().toLocaleDateString() : '';
                    previewContent.innerHTML += `
                        <div style="margin-bottom: 25px; border-bottom: 1px solid #e2e8f0; padding-bottom: 20px;">
                            <div style="font-size: 0.8rem; font-weight: bold; color: #0284c7; text-transform: uppercase;">[${itemData.tipo}] - ${fechaStr}</div>
                            <h3 style="font-size: 1.1rem; margin: 4px 0 8px 0; color: #0f172a;">${itemData.titulo || itemData.resumen || ''}</h3>
                            <div style="font-size: 0.95rem; color: #334155; line-height: 1.5;">
                                ${itemData.detalle || itemData.contenido || 'Contenido del registro sincronizado.'}
                            </div>
                        </div>
                    `;
                }
            });
        }

        document.getElementById('btn-save-report').addEventListener('click', async () => {
            const seleccionados = Array.from(document.querySelectorAll('#elite-items-list input[type="checkbox"]:checked'))
                                       .map(chk => chk.value);

            if (seleccionados.length === 0 || !patientId) {
                alert("Seleccione un paciente y al menos un registro.");
                return;
            }

            try {
                await db.collection('patients').doc(patientId).collection('reportes_historia_clinica').add({
                    elementosSeleccionados: seleccionados,
                    fechaCreacion: firebase.firestore.FieldValue.serverTimestamp(),
                    estado: "Consolidado Oficial"
                });
                alert("¡Reporte consolidado guardado exitosamente en la historia clínica!");
            } catch (e) {
                console.error(e);
                alert("Ocurrió un error al guardar el reporte.");
            }
        });

        document.getElementById('btn-print-report').addEventListener('click', () => {
            window.print();
        });
    </script>
</body>
</html>
